name: Build PulseRelay APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-36.1" "build-tools;36.1.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Firebase and keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -f .env.example ] || touch .env.example
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ ! -f app/google-services.json ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ -f app/google-services.json ]; then
            python3 -m json.tool app/google-services.json >/dev/null
            echo "Firebase config OK ($(wc -c < app/google-services.json) bytes)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is missing — Google & Phone Sign-In will be disabled in this APK."
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Registered debug.keystore restored from secret"
          elif [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is missing — generating temporary keystore (Google Sign-In SHA-1 will not match)."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug -PversionCodeOverride=${{ github.run_number }} -PversionNameOverride=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk PulseRelay-latest.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseRelay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Rolling APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PulseRelay v1.0.${{ github.run_number }}
          body: |
            Automated PulseRelay APK build #${{ github.run_number }} (version 1.0.${{ github.run_number }}).
            Direct APK download: `PulseRelay-latest.apk`
          files: PulseRelay-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
